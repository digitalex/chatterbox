name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches-ignore: [ "main" ] # Main is handled by deploy.yaml

jobs:
  build-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Build Client
        run: |
          cd client
          npm i
          npm run build

  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Build Server
        run: |
          cd server
          go build -v ./...