name: Deploy Client

on:
  push:
    branches: [ "main" ]
    paths:
      - 'client/**' # Only trigger if client code changes
      - '.github/workflows/deploy-client.yaml'

jobs:
  deploy-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Build
        run: |
          cd client
          npm i
          npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.GCP_SA_KEY }}'
          channelId: live
          projectId: chatterbox-480916
          entryPoint: ./client
        env:
          FIREBASE_CLI_PREVIEWS: none